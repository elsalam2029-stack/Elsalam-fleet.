<title>شركة السلام للمقاولات والتوريدات العمومية | نظام إدارة الأسطول</title>
<style>
:root {
 --site-primary:#142B4A; --site-secondary:#C79A3B; --site-background:#F3F5F8;
 --site-on-primary:#FFFFFF; --site-on-secondary:#17243A; --site-on-background:#182338;
 --site-font-body:Tahoma,Arial,sans-serif; --site-font-heading:Tahoma,Arial,sans-serif;
 --site-heading-scale:1; --site-spacing-scale:1; --site-radius-scale:1; --site-decoration-opacity:1;
 --surface:#FFFFFF; --muted:#6D7889; --line:#E2E7EE; --green:#16836B; --red:#B84A4A;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--site-font-body);background:light-dark(#F3F5F8,#111927);color:light-dark(#182338,#EDF2FA)}
#app{min-height:100vh;background-color:var(--site-background);color:var(--site-on-background);display:flex}
.sidebar{width:250px;background:var(--site-primary);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:24px;flex-shrink:0}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 20px;border-bottom:1px solid #ffffff25}
.logo{width:45px;height:45px;border-radius:13px;background:var(--site-secondary);display:grid;place-items:center;color:#142B4A;font-weight:900;font-size:20px}
.brand strong{font-size:16px;line-height:1.8}.brand small{display:block;color:#c4cfdd;font-size:11px}
.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d7dfeb;text-align:right;padding:12px 13px;border-radius:10px;font:inherit;cursor:pointer;display:flex;gap:11px;align-items:center}
.nav button.active,.nav button:hover{background:#ffffff1a;color:#fff}.nav .ico{width:22px;text-align:center;color:#e5bd67}
.sidebar-foot{margin-top:auto;font-size:11px;line-height:1.9;color:#c4cfdd;padding:12px}
.main{min-width:0;flex:1}
.topbar{height:78px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}
.crumb{color:var(--muted);font-size:12px}.topbar h1{font-size:20px;margin:4px 0 0}
.top-actions{display:flex;gap:10px;align-items:center}.avatar{background:#e8edf5;color:var(--site-primary);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:bold}
button,.btn{font-family:inherit;cursor:pointer}.btn{border:1px solid var(--line);background:#fff;color:#26354b;padding:10px 14px;border-radius:9px;font-size:13px}.btn.primary{background:var(--site-primary);color:white;border-color:var(--site-primary)}.btn.gold{background:var(--site-secondary);color:#17243a;border-color:var(--site-secondary);font-weight:bold}
.content{padding:26px 30px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.welcome h2{font-size:22px;margin:0 0 7px}.welcome p{margin:0;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 3px 12px #1b2a3a08}
.metric-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.metric-icon{width:38px;height:38px;border-radius:11px;background:#eef2f7;display:grid;place-items:center;font-size:18px}.metric strong{display:block;font-size:27px;margin-top:13px;color:var(--site-primary)}.metric small{color:var(--muted);font-size:11px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h3{font-size:15px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}
.notice{border:1px solid #ead9ac;background:#fff9e9;color:#72551a;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.8;margin-bottom:18px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#f8f9fb;border:1px solid var(--line);border-radius:11px;padding:16px 10px;text-align:right;color:#26354b}.quick b{display:block;margin-bottom:7px}.quick span{font-size:11px;color:var(--muted)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{text-align:right;color:var(--muted);background:#f8f9fb;font-weight:600}td,th{padding:12px 11px;border-bottom:1px solid var(--line)}tbody tr:hover{background:#fafbfd}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf5f2;color:#18765e;font-size:11px}.pill.warn{background:#fff2dd;color:#95671a}.pill.gray{background:#eef1f5;color:#59677a}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.search{min-width:200px;flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;background:white;color:#182338}.select,.field input,.field select,.field textarea{width:100%;border:1px solid #dbe1e9;border-radius:8px;padding:10px 11px;font:inherit;background:white;color:#182338}.field label{display:block;font-size:12px;color:#59677a;margin-bottom:7px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field.full{grid-column:1/-1}.field input:focus,.field select:focus{outline:2px solid #c79a3b66;border-color:var(--site-secondary)}
.vehicle-detail{background:#f4f7fb;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;font-size:12px;line-height:2;color:#35445a}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.section-title{margin:0 0 6px;font-size:22px}.section-desc{margin:0 0 22px;color:var(--muted);font-size:13px}
.modal-back{position:fixed;inset:0;background:#0b172a77;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-back.show{display:flex}.modal{background:white;color:#182338;width:min(780px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h3{margin:0}.x{border:0;background:#eef1f5;border-radius:8px;width:34px;height:34px;font-size:18px}
@media(max-width:1000px){.sidebar{width:78px;padding:18px 10px}.brand{padding:0 5px 18px}.brand>div:last-child,.nav .label,.sidebar-foot{display:none}.nav button{justify-content:center;font-size:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:620px){.sidebar{width:58px}.cards{grid-template-columns:1fr 1fr;gap:9px}.metric{padding:13px}.metric strong{font-size:22px}.topbar h1{font-size:15px}.top-actions .btn{display:none}.content{padding:16px 12px}.welcome{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.topbar{height:68px}}
@media print{body,#app{background:#fff!important;color:#111!important}.sidebar,.top-actions,.toolbar,.quick,.modal-back{display:none!important}.main{width:100%}.topbar{height:auto;padding:8px 0;border:0}.content{padding:8px;max-width:none}.panel,.metric{box-shadow:none;break-inside:avoid;border:1px solid #ccc}.cards{grid-template-columns:repeat(4,1fr)}table{font-size:10px;white-space:normal}th,td{padding:6px;border-color:#bbb}.section-title{font-size:18px}button{display:none!important} }
</style>

 }else if(page==="reports"){
 c.innerHTML=pageHeader("التقارير والطباعة","اختر التقرير المطلوب، ثم استخدم زر الطباعة لحفظه PDF أو طباعته.",`<div class="toolbar"><button class="btn primary" onclick="window.print()">طباعة / حفظ PDF</button><button class="btn" onclick="exportCSV()">تصدير CSV</button></div>`)+`<div class="grid2"><div class="panel"><h3>تقرير إضافي السائقين</h3><p class="sub">تجميع السجلات حسب السائق، مع ساعات العمل والإضافي والانحرافات.</p><button class="btn" style="margin-top:12px" onclick="setPage('overtime')">فتح التقرير</button></div><div class="panel"><h3>تقرير استهلاك الوقود</h3><p class="sub">معدل الاستهلاك لكل سيارة حسب فرق الكيلومترات وعدد اللترات.</p><button class="btn" style="margin-top:12px" onclick="setPage('fuel')">فتح التقرير</button></div></div><div class="panel"><div class="panel-head"><h3>ملخص حسب السائق</h3></div>${table(["السائق","عدد خطوط السير","إجمالي ساعات العمل","إجمالي الإضافي","الانحرافات"],state.drivers.map(d=>{let ts=state.trips.filter(t=>t.driver===d.name);return `<tr><td>${esc(d.name)}</td><td>${ts.length}</td><td>${fmt(ts.reduce((a,t)=>a+calcTripHours(t).hours,0))}</td><td>${fmt(driverDaySummaries().filter(x=>x.driver===d.name).reduce((a,x)=>a+x.overtime,0))}</td><td>${fmt(ts.reduce((a,t)=>a+(+t.deviation||0),0))}</td></tr>`}))}</div>`;
 }else if(page==="settings"){
 c.innerHTML=pageHeader("الإعدادات والصلاحيات","إعداد ساعات العمل وسعر الوقود حسب التاريخ وإدارة حسابات الموظفين.",`<div class="notice">إدارة المستخدمين هنا نموذج توضيحي فقط؛ لا تمثل صلاحيات آمنة حقيقية حتى يتم ربط النظام بخادم وتسجيل دخول فعلي.</div>`)+`<div class="grid2"><div class="panel"><div class="panel-head"><h3>قواعد احتساب الإضافي</h3></div><form onsubmit="saveRules(event)"><div class="field"><label>ساعات العمل الفعلية اليومية</label><input type="number" min="1" max="24" name="hours" value="${state.rules.hours}" required></div><label style="display:flex;gap:9px;align-items:center;margin:14px 0;font-size:13px"><input type="checkbox" name="multiVehicle" ${state.rules.multiVehicle?'checked':''}> احتساب تعدد السيارات في اليوم كتنبيه للمراجعة</label><button class="btn primary">حفظ الإعدادات</button></form><p class="sub">قاعدة تعدد السيارات لا تضيف ساعات تلقائياً في هذا النموذج، لأن مقدار الإضافي الإضافي يحتاج تحديد سياسة الشركة.</p></div><div class="panel"><div class="panel-head"><h3>أسعار الوقود حسب التاريخ</h3></div><form onsubmit="addPrice(event)"><div class="formgrid"><div class="field"><label>تاريخ سريان السعر</label><input type="date" name="date" required></div><div class="field"><label>نوع الوقود</label><select name="type"><option>جاز</option><option>بنزين 80</option><option>بنزين 92</option><option>بنزين 95</option><option>غاز</option></select></div><div class="field"><label>سعر اللتر (جنيه)</label><input type="number" name="price" min="0.01" step="0.01" required></div></div><button class="btn primary" style="margin-top:12px">＋ إضافة سعر</button></form><div style="margin-top:18px">${table(["تاريخ السريان","نوع الوقود","سعر اللتر"],state.fuelPrices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.type)}</td><td>${fmt(p.price)} ج.م</td></tr>`))}</div></div></div><div class="panel"><div class="panel-head"><h3>حسابات الموظفين (نموذج محلي غير آمن)</h3><button class="btn primary" onclick="openUser()">＋ إضافة حساب</button></div>${table(["اسم المستخدم","الدور","الحالة","إجراء"],state.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td><span class="pill ${u.active?'':'gray'}">${u.active?'نشط':'موقوف'}</span></td><td><button class="btn" onclick="toggleUser(${i})">${u.active?'إيقاف':'تفعيل'}</button> <button class="btn" onclick="deleteUser(${i})">حذف</button></td></tr>`))}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>شعار الشركة</h3><p class="sub">اختر صورة الشعار ليتم عرضها محلياً على هذا المتصفح فقط.</p><input type="file" accept="image/*" onchange="saveLogo(event)"></div>`;
 }
}
function vehicleTable(){return `<table id="vehicleTable"><thead><tr>${["اللوحة","النوع","الماركة","الموديل","سنة الصنع","الشاسية","الماتور","اللون","إجراء"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${state.vehicles.map(v=>`<tr><td><b>${esc(v.plate)}</b></td><td>${esc(v.kind)}</td><td>${esc(v.make)}</td><td>${esc(v.model)}</td><td>${esc(v.year)}</td><td>${esc(v.chassis)}</td><td>${esc(v.engine)}</td><td>${esc(v.color)}</td><td><button class="btn" onclick="deleteVehicle('${esc(v.plate)}')">حذف</button></td></tr>`).join("")}</tbody></table>`}
function driverTable(){return `<table id="driverTable"><thead><tr><th>م</th><th>اسم السائق</th><th>الحالة</th><th>خطوط السير</th><th>إجراء</th></tr></thead><tbody>${state.drivers.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.name)}</td><td><span class="pill ${d.active?'':'gray'}">${d.active?'نشط':'موقوف'}</span></td><td>${state.trips.filter(t=>t.driver===d.name).length}</td><td><button class="btn" onclick="toggleDriver(${d.id})">${d.active?'إيقاف':'تفعيل'}</button> <button class="btn" onclick="deleteDriver(${d.id})">حذف</button></td></tr>`).join("")}</tbody></table>`}
function tripTable(){return `<table id="tripTable"><thead><tr>${["رقم الورقة","التاريخ","السائق","اللوحة","المكان من","إلى","عداد البداية","عداد النهاية","بداية العمل","نهاية العمل","العمل","الإضافي"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${state.trips.map(t=>{let h=calcTripHours(t);return `<tr><td>${esc(t.paper||"—")}</td><td>${esc(t.date)}</td><td>${esc(t.driver)}</td><td>${esc(t.plate)}</td><td>${esc(t.origin||"—")}</td><td>${esc(t.destination||"—")}</td><td>${fmt(t.startKm)}</td><td>${fmt(t.endKm)}</td><td>${esc(t.start)}</td><td>${esc(t.end)}</td><td>${fmt(h.hours)}</td><td>${fmt(h.overtime)}</td></tr>`}).join("")}</tbody></table>`}
function calcTripHours(t){const hours=tripHours(t);const day=driverDaySummaries().find(x=>x.date===t.date&&x.driver===t.driver);return {hours,overtime:day?day.overtime:Math.max(0,hours-state.rules.hours-(+t.deviation||0))}}
function fuelRows(){return state.fuel.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.plate.localeCompare(b.plate))}
function fuelTable(){return `<table id="fuelTable"><thead><tr>${["التاريخ","السائق","السيارة","نوع الوقود","العداد","المبلغ","سعر اللتر","اللترات","فرق العداد","معدل كم/لتر"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${fuelRows().map(f=>{let price=+f.pricePerLiter||priceAt(f.date,f.type),liters=price?(+f.liters||(+f.amount||0)/price):0;let prev=fuelRows().filter(x=>x.plate===f.plate&&x.date<f.date).slice(-1)[0];let diff=prev?Math.max(0,(+f.odometer||0)-(+prev.odometer||0)):null;return `<tr><td>${esc(f.date)}</td><td>${esc(f.driver)}</td><td>${esc(f.plate)}</td><td>${esc(f.type)}</td><td>${fmt(f.odometer)}</td><td>${fmt(f.amount)} ج.م</td><td>${fmt(price)}</td><td>${fmt(liters)}</td><td>${diff===null?'—':fmt(diff)}</td><td>${diff===null||!liters?'—':fmt(diff/liters)}</td></tr>`}).join("")}</tbody></table>`}
function priceAt(date,type){return state.fuelPrices.filter(p=>p.date<=date&&p.type===type).sort((a,b)=>b.date.localeCompare(a.date))[0]?.price||0}
function filterTable(id,q){let t=document.getElementById(id);if(!t)return;[...t.tBodies[0].rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?"":"none")}
function openModal(title,body){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=body;$("#modalBack").classList.add("show")}
function closeModal(){$("#modalBack").classList.remove("show")}
function options(arr,valueKey,labelKey,selected){return arr.map(x=>`<option value="${esc(x[valueKey])}" ${x[valueKey]===selected?'selected':''}>${esc(x[labelKey])}</option>`).join("")}
function openTrip(){
const active=state.drivers.filter(d=>d.active);
openModal("تسجيل خط سير جديد",`<form onsubmit="saveTrip(event)"><div class="formgrid">
<div class="field"><label>رقم ورقة خط السير</label><input name="paper" placeholder="مثال: 0001" required></div>
<div class="field"><label>التاريخ</label><input name="date" type="date" value="${todayLocal()}" required></div>
<div class="field"><label>اسم السائق</label><select name="driver" required>${options(active,"name","name")}</select></div>
<div class="field"><label>رقم السيارة / اللوحة</label><select id="tripPlate" name="plate" required onchange="showVehicleDetail(this.value)">${options(state.vehicles,"plate","plate")}</select></div>
<div class="field"><label>وقت بداية السائق</label><input name="start" type="time" required></div><div class="field"><label>وقت نهاية السائق</label><input name="end" type="time" required></div>
<div class="field"><label>عداد بداية السيارة (كم)</label><input name="startKm" type="number" min="0" step="0.1" required></div><div class="field"><label>عداد نهاية السيارة (كم)</label><input name="endKm" type="number" min="0" step="0.1" required></div><div class="field"><label>استراحة (ساعات، إن وجدت)</label><input name="breakHours" type="number" min="0" step=".25" value="0"></div>
<div class="field"><label>مكان البداية</label><input name="origin"></div><div class="field"><label>مكان النهاية</label><input name="destination"></div><div class="field"><label>ساعات انحراف مستبعدة من الإضافي</label><input name="deviation" type="number" min="0" step=".25" value="0"></div><div class="field"><label>نوع الانحراف</label><select name="deviationType"><option value="">لا يوجد</option><option>انحراف ساعات عمل</option><option>انحراف مشوار</option><option>تأخير</option><option>خروج عن خط السير</option></select></div>
<div class="field full"><div id="vehicleDetail" class="vehicle-detail"></div></div><div class="field full"><label>ملاحظات / انحرافات المشوار</label><textarea name="notes" rows="2"></textarea></div></div><div style="display:flex;justify-content:flex-start;gap:10px;margin-top:18px"><button class="btn primary">حفظ خط السير</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`);
showVehicleDetail(state.vehicles[0]?.plate)
}
function showVehicleDetail(plate){let v=state.vehicles.find(v=>v.plate===plate);let el=$("#vehicleDetail");if(el)el.innerHTML=v?`<b>بيانات السيارة تلقائياً:</b> النوع: ${esc(v.kind)} · الماركة: ${esc(v.make)} · الموديل: ${esc(v.model)} · السنة: ${esc(v.year)} · الشاسية: ${esc(v.chassis)} · الماتور: ${esc(v.engine)} · اللون: ${esc(v.color)}`:"لا توجد بيانات"}
function saveTrip(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.startKm=+o.startKm;o.endKm=+o.endKm;o.breakHours=+o.breakHours;o.deviation=+o.deviation;if(o.endKm<o.startKm){alert("عداد النهاية يجب أن يكون أكبر من أو يساوي عداد البداية");return}state.trips.push(o);save();closeModal();render("trips")}
function openFuel(){openModal("تسجيل تفويلة جديدة",`<form onsubmit="saveFuel(event)"><div class="formgrid">
<div class="field"><label>اسم السائق</label><select name="driver" required>${options(state.drivers.filter(d=>d.active),"name","name")}</select></div>
<div class="field"><label>تاريخ التفويل</label><input name="date" type="date" value="${todayLocal()}" required></div>
<div class="field"><label>رقم السيارة</label><select name="plate" required>${options(state.vehicles,"plate","plate")}</select></div>
<div class="field"><label>نوع الوقود</label><select name="type"><option>جاز</option><option>بنزين 80</option><option>بنزين 92</option><option>بنزين 95</option><option>غاز</option></select></div>
<div class="field"><label>عداد الكيلومتر وقت التفويل</label><input name="odometer" type="number" min="0" required></div>
<div class="field"><label>مبلغ التفويل (جنيه)</label><input name="amount" type="number" min=".01" step=".01" required></div>
<div class="field full"><div class="vehicle-detail">سعر اللتر سيُحدد تلقائياً وفق نوع الوقود وتاريخ التفويل. أضف السعر وتاريخ سريانه من صفحة الإعدادات إذا لم يكن موجوداً.</div></div></div><div style="margin-top:18px"><button class="btn primary">حفظ التفويلة</button> <button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`)}
function saveFuel(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.odometer=+o.odometer;o.amount=+o.amount;o.pricePerLiter=priceAt(o.date,o.type);if(!o.pricePerLiter){alert("لا يوجد سعر مسجل لهذا النوع من الوقود في هذا التاريخ. أضف السعر من الإعدادات أولاً.");return}o.liters=o.amount/o.pricePerLiter;let prev=fuelRows().filter(f=>f.plate===o.plate&&f.date<=o.date).slice(-1)[0];if(prev&&o.odometer<+prev.odometer){if(!confirm("العداد أقل من آخر تفويلة مسجلة. هل تريد الحفظ على أي حال؟"))return}state.fuel.push(o);save();closeModal();render("fuel")}
function openDriver(){openModal("إضافة سائق",`<form onsubmit="saveDriver(event)"><div class="field"><label>الاسم بالكامل</label><input name="name" required></div><button class="btn primary" style="margin-top:14px">حفظ السائق</button></form>`)}
function saveDriver(e){e.preventDefault();let name=new FormData(e.target).get("name").trim();if(state.drivers.some(d=>d.name===name)){alert("اسم السائق موجود بالفعل");return}state.drivers.push({id:Date.now(),name,active:true});save();closeModal();render("drivers")}
function toggleDriver(id){let d=state.drivers.find(d=>d.id===id);if(d)d.active=!d.active;save();render("drivers")}
function deleteDriver(id){const d=state.drivers.find(x=>x.id===id);if(!d)return;if(state.trips.some(t=>t.driver===d.name)||state.fuel.some(f=>f.driver===d.name)){alert("لا يمكن حذف سائق مرتبط بسجلات؛ أوقفه بدلاً من ذلك للحفاظ على التقارير.");return}if(confirm("حذف السائق "+d.name+"؟")){state.drivers=state.drivers.filter(x=>x.id!==id);save();render("drivers")}}
function openVehicle(){openModal("إضافة سيارة",`<form onsubmit="saveVehicle(event)"><div class="formgrid">${[["plate","رقم اللوحة"],["kind","النوع"],["make","الماركة"],["model","الموديل"],["year","سنة الصنع"],["chassis","رقم الشاسية"],["engine","رقم الماتور"],["color","اللون"]].map(([n,l])=>`<div class="field"><label>${l}</label><input name="${n}" ${n==="plate"?"required":""}></div>`).join("")}</div><button class="btn primary" style="margin-top:14px">حفظ السيارة</button></form>`)}
function saveVehicle(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(state.vehicles.some(x=>x.plate===v.plate)){alert("رقم اللوحة موجود بالفعل");return}state.vehicles.push(v);save();closeModal();render("vehicles")}
function deleteVehicle(plate){if(state.trips.some(t=>t.plate===plate)||state.fuel.some(f=>f.plate===plate)){alert("لا يمكن حذف سيارة مرتبطة بسجلات تشغيل أو تفويل؛ حافظ على السجل أو عطّل السيارة في إصدار قاعدة البيانات.");return}if(confirm("حذف السيارة "+plate+"؟")){state.vehicles=state.vehicles.filter(v=>v.plate!==plate);save();render("vehicles")}}
function saveRules(e){e.preventDefault();let fd=new FormData(e.target);state.rules.hours=+fd.get("hours");state.rules.multiVehicle=fd.get("multiVehicle")==="on";save();render("settings");alert("تم حفظ القاعدة في النموذج المحلي")}
function addPrice(e){e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries());p.price=+p.price;state.fuelPrices.push(p);save();render("settings")}
function openUser(){openModal("إضافة حساب تجريبي",`<form onsubmit="saveUser(event)"><div class="formgrid"><div class="field"><label>اسم المستخدم</label><input name="name" required></div><div class="field"><label>الدور</label><select name="role"><option>موظف خطوط سير</option><option>مسؤول تفويلات</option><option>مشرف</option><option>مدير</option></select></div></div><p class="sub">لا تدخل كلمة مرور حقيقية في النموذج التجريبي.</p><button class="btn primary">إضافة</button></form>`)}
function saveUser(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());state.users.push({...o,active:true});save();closeModal();render("settings")}
function toggleUser(i){if(state.users[i])state.users[i].active=!state.users[i].active;save();render("settings")}
function deleteUser(i){if(state.users[i]?.role==="مدير"&&state.users.filter(u=>u.role==="مدير"&&u.active).length<=1){alert("لا يمكن حذف آخر مدير نشط.");return}if(confirm("حذف الحساب؟")){state.users.splice(i,1);save();render("settings")}}
function saveLogo(e){const file=e.target.files?.[0];if(!file)return;if(file.size>500000){alert("اختر صورة شعار أقل من 500 كيلوبايت.");return}const reader=new FileReader();reader.onload=()=>{state.logo=reader.result;save();applyLogo();alert("تم حفظ الشعار في هذا المتصفح فقط.")};reader.readAsDataURL(file)}
function applyLogo(){const el=document.getElementById("brandLogo");if(el&&state.logo){el.innerHTML=`<img src="${state.logo}" alt="شعار الشركة" style="width:100%;height:100%;object-fit:contain;border-radius:10px">`;el.style.overflow="hidden"}}
function exportCSV(){let rows=[["رقم الورقة","التاريخ","السائق","السيارة","بداية","نهاية","عداد البداية","عداد النهاية","ساعات العمل","الإضافي","الانحرافات","نوع الانحراف","ملاحظات"],...state.trips.map(t=>{let h=calcTripHours(t);return [t.paper,t.date,t.driver,t.plate,t.start,t.end,t.startKm,t.endKm,h.hours,h.overtime,t.deviation,t.notes]})];let csv="\uFEFF"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.download="تقرير-خطوط-السير.csv";a.click();URL.revokeObjectURL(a.href)}
applyLogo();
render();
</script>


</body></html>
